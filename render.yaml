# Plano de despliegue del backend en Render (https://render.com).
# Al crear un "Blueprint" en Render apuntando a este repositorio,
# este archivo configura el servicio automáticamente.
# Las claves (DATABASE_URL, API keys) se ingresan en el panel de Render:
# nunca viven en el repositorio.
services:
  - type: web
    name: scifinder-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORE_API_KEY
        sync: false
      - key: SEMANTIC_SCHOLAR_API_KEY
        sync: false
