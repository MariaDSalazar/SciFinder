# Despliegue automático del frontend a GitHub Pages.
# Se ejecuta en cada push a main que toque el cliente (o manualmente).
# La URL del backend llega por la variable de repositorio VITE_API_BASE_URL
# (Settings → Secrets and variables → Actions → Variables).
name: Desplegar frontend en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Instalar dependencias
        working-directory: client
        run: npm ci

      - name: Compilar
        working-directory: client
        env:
          # URL del backend. Se fija aquí porque la variable de repo
          # VITE_API_BASE_URL seguía apuntando al backend viejo (ya retirado).
          VITE_API_BASE_URL: https://MariaSalazar-scifinder-api.hf.space
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
